<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nicht gefunden – Wunschsite</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/retro.css">
</head>
<body>
  <main class="desktop">
    <section class="window tb-red msgbox" style="margin:10vh auto 0" role="alert">
      <div class="title-bar">
        <div class="title-bar-text"><img src="/img/icon-fehler.svg" alt=""><span>Fehler 404</span></div>
        <div class="title-bar-controls" aria-hidden="true"><span class="tb-btn close">×</span></div>
      </div>
      <div class="window-body">
        <div class="msgbox-content">
          <img src="/img/icon-fehler.svg" alt="">
          <p>Die Seite wurde nicht gefunden.<br>Vielleicht hat sie jemand ausgepackt?</p>
        </div>
        <div class="button-row center"><a class="btn btn-default" href="/">OK</a></div>
      </div>
    </section>
  </main>
</body>
</html>
